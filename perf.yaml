---
# Thresholds of the perf tier (tests/perf), per endpoint of podiumd_tests.perf.runs.ENDPOINTS.
# p95_ms and max_failure_ratio are TA's k6 thresholds. A slowdown: the p95 grew more than max_slowdown
# times and more than min_slowdown_ms against the median of the environment's earlier runs with the same
# settings. An entry under endpoints overrides the defaults for one endpoint.
defaults:
  p95_ms: 1500
  max_failure_ratio: 0.01
  max_slowdown: 1.5
  min_slowdown_ms: 200
endpoints:
  # Starting a zaak in ZAC creates the zaak, its status and rol in Open Zaak and its CMMN case, and indexes it.
  zac_zaak_create: {p95_ms: 5000}
  # Two requests: the zaak's documenttypen, and the upload that creates the document and its link in Open Zaak.
  zac_document_upload: {p95_ms: 3000}
# What a Locust run may do to the components it loads (podiumd_tests.perf.availability): their roots answer
# without a 5xx in at least min_available of the samples taken every health_interval_s; no container restarts;
# their pods are Ready again within recovery_s after the run; no container's RSS passes max_memory_ratio of its
# memory limit. RSS, not the working set: the working set includes page cache the kernel reclaims before an OOM kill
# (Elasticsearch's sits near its limit by design); the report shows it as information.
availability:
  health_interval_s: 5
  recovery_s: 60
  min_available: 0.99
  max_memory_ratio: 0.9
