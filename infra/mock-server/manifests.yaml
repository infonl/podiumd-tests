# podiumd-tests mock server (PLAN.md §4 A2). Applied and deleted by bootstrap step infra-mock-server;
# the ConfigMap's server.py is filled in from infra/mock-server/server.py at apply time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ptest-bootstrap-mock-server
  labels:
    app.kubernetes.io/name: ptest-bootstrap-mock-server
    app.kubernetes.io/managed-by: podiumd-tests
data:
  server.py: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptest-bootstrap-mock-server
  labels:
    app.kubernetes.io/name: ptest-bootstrap-mock-server
    app.kubernetes.io/managed-by: podiumd-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ptest-bootstrap-mock-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptest-bootstrap-mock-server
        app.kubernetes.io/managed-by: podiumd-tests
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: app, mountPath: /app}
            - {name: data, mountPath: /data}
      volumes:
        - name: app
          configMap:
            name: ptest-bootstrap-mock-server
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ptest-bootstrap-mock-server
  labels:
    app.kubernetes.io/name: ptest-bootstrap-mock-server
    app.kubernetes.io/managed-by: podiumd-tests
spec:
  selector:
    app.kubernetes.io/name: ptest-bootstrap-mock-server
  ports:
    - port: 80
      targetPort: 8080
