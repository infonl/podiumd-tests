# SSC Twente ExternalsPodiumD environment ontw-dimp (applications/gemeenten/dimp/ontw/).
# Every tier, chaos included (user, 2026-10-13).
estate: externals
allowed_tiers: [smoke, core, full, perf, chaos]
kube:
  context: aks-blue-ontw-dimp
  namespace: podiumd
  monitoring_namespace: monitoring
urls:
  zac: https://ontw-zac.dimpact.nl
  openzaak: https://ontw-openzaak.dimpact.nl
  openklant: https://ontw-openklant.dimpact.nl
  objecten: https://ontw-objecten.dimpact.nl
  objecttypen: https://ontw-objecttypen.dimpact.nl
  opennotificaties: https://ontw-notificaties.dimpact.nl
  openformulieren: https://ontw-formulier.dimpact.nl
  openinwoner: https://ontw-mijn.dimpact.nl
  keycloak: https://ontw-keycloak.dimpact.nl
  keycloak-admin: https://ontw-keycloak-admin.dimpact.nl
  kiss: https://ontw-contact.dimpact.nl
  ita: https://ontw-ita.dimpact.nl
  pabc: https://ontw-pabc.dimpact.nl
  openarchiefbeheer: https://ontw-abc.dimpact.nl
  openbeheer: https://ontw-openbeheer.dimpact.nl
  grafana: https://ontw-podiumd-logs.dimpact.nl
secrets:
  # keycloak-operator's master admin, as on podiumd-infra (checked on ontw-dimp 2026-10-29).
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  pabc_api_key:
    pod_env: {deployment: pabc, var: API_KEY__0}
