# SSC Twente ExternalsPodiumD environment ontw-dim2 (applications/gemeenten/dim2/ontw/).
# Every tier except chaos.
estate: externals
allowed_tiers: [smoke, core, full, perf]
kube:
  context: aks-blue-ontw-dim2
  namespace: podiumd
  monitoring_namespace: monitoring
urls:
  zac: https://ontw-zac.dim2.dimpact.nl
  openzaak: https://ontw-openzaak.dim2.dimpact.nl
  openklant: https://ontw-openklant.dim2.dimpact.nl
  objecten: https://ontw-objecten.dim2.dimpact.nl
  objecttypen: https://ontw-objecttypen.dim2.dimpact.nl
  opennotificaties: https://ontw-notificaties.dim2.dimpact.nl
  openformulieren: https://ontw-formulier.dim2.dimpact.nl
  openinwoner: https://ontw-mijn.dim2.dimpact.nl
  keycloak: https://ontw-keycloak.dim2.dimpact.nl
  keycloak-admin: https://ontw-keycloak-admin.dim2.dimpact.nl
  kiss: https://ontw-contact.dim2.dimpact.nl
  ita: https://ontw-ita.dim2.dimpact.nl
  openarchiefbeheer: https://ontw-abc.dim2.dimpact.nl
  grafana: https://ontw-podiumd-logs.dim2.dimpact.nl
secrets:
  # The realm-scoped podiumd admin the chart creates; needed to make the test users.
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
bootstrap:
  # The environment owner agreed to test wiring here (DigiD/eHerkenning mock, OpenKlant2, CMS pages, KISS kanalen).
  wiring: true
