# podiumd-minikube (infonl/podiumd-minikube): *.local hosts through the NGINX Gateway Fabric
# LoadBalancer IP (`minikube tunnel`), as ExternalsPodiumD's edge; no /etc/hosts edits needed.
estate: minikube
allowed_tiers: [smoke, core, full, perf, chaos]
kube:
  context: minikube
  namespace: podiumd-minikube
access:
  mode: host-header
  ingress_service:
    namespace: ingress-basic
    name: public-gateway-nginx
  # podiumd-minikube's local CA plus the system CAs, as its pods trust them.
  ca_bundle:
    configmap: podiumd-ca
    key: ca-bundle.pem
urls:
  zac: https://zac.local
  keycloak: https://keycloak.local
  keycloak-admin: https://keycloak-admin.local
  openzaak: https://openzaak.local
  openklant: https://openklant.local
  pabc: https://pabc.local
  kiss: https://contact.local
  ita: https://ita.local
  objecten: https://objecten.local
  objecttypen: https://objecttypen.local
  openbeheer: https://openbeheer.local
  referentielijsten: https://referentielijsten.local
  opennotificaties: https://opennotificaties.local
  openarchiefbeheer: https://openarchiefbeheer-ui.local
  openformulieren: https://openformulieren-nginx.local
  openinwoner: https://openinwoner.local
  grafana: https://grafana.local
  mailpit: https://mailpit.local
  api-proxy: https://api-proxy.local
  omc: https://omc.local
  openvtb: https://openvtb.local
  zaakbrug: https://zaakbrug.local
  zgw-office-addin: https://office-addin.local
  # podiumd-minikube profile frankgateway (on with --full).
  openbao: https://openbao.local
  # No ingress, as on ExternalsPodiumD: reached through a port-forward.
  frankgateway: http://frankgateway-outway.podiumd-minikube.svc.cluster.local:9080
secrets:
  # keycloak-operator's master admin, as on podiumd-infra.
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  # Well-known dev defaults of podiumd-minikube; the only place literals are allowed.
  # Superuser of every Maykin app (podiumd-minikube create-superuser Jobs).
  django_admin_username:
    dev_default: admin
  django_admin_password:
    dev_default: admin
  # Read from Open Zaak in the cluster: the Open Formulieren client, for read-only smoke.
  pabc_api_key:
    pod_env: {deployment: pabc, var: API_KEY__0}
  # KISS's Objecten token for its logboek (Activiteitenlog), as the contact pod sees it.
  kiss_logboek_token:
    pod_env: {deployment: contact-web, var: LOGBOEK_TOKEN}
  zgw_client_secret:
    zgw_jwt_secret: {deployment: openzaak, client_id: formulier}
  # Signs the bootstrap's OMC abonnement token; read from OMC's own Secret.
  omc_jwt_secret:
    k8s_secret: {name: omc, key: OMC_AUTH_JWT_SECRET}
  # Test user of acc-mock, the stand-in for the acceptance Keycloak behind admin identity provider accp-dimp-oidc.
  admin_idp_username:
    k8s_secret: {name: keycloak-acc-mock, key: username}
  admin_idp_password:
    k8s_secret: {name: keycloak-acc-mock, key: password}
settings:
  zgw_client_id: formulier
  # No local superuser: Open Inwoner as in ExternalsPodiumD and podiumd-infra; Open VTB (podiumd-minikube creates none).
  django_admin_sso_only: openinwoner,openvtb
  # podiumd-minikube's opt-in clamav profile (clamd with the EICAR signature only).
  clamav: "clamav:3310"
  # podiumd's e2e zaaktype (create_required_catalogi_job), as ExternalsPodiumD; ZAC's zaakafhandelparameters
  # map this productaanvraagtype to it (podiumd-minikube seed).
  productaanvraag_type: productaanvraag-zaaktype-voor-e2e-testen
  productaanvraag_zaaktype: zaaktype-voor-e2e-testen
  # podiumd-minikube allows bootstrap to switch on ZAC's ontvangstbevestiging for that zaaktype (2026-10-09).
  zac_email_confirmation: true
  # podiumd-minikube allows bootstrap to switch on its human task Aanvullende informatie (2026-10-21).
  zac_aanvullende_informatie: true
  # podiumd-minikube asks bootstrap to give that zaaktype the besluittype ZAC's inrichtingscheck needs (2026-10-09).
  zac_besluittype: true
  # KISS's kanalen are runtime data no environment seeds; bootstrap adds Balie, Telefoon and Internet (2026-10-10).
  kiss_kanalen: true
  # Open Formulieren's wait_for_payment_to_register is runtime data no environment sets; bootstrap switches it on (2026-10-10).
  of_wait_for_payment: true
  # seed-volume --scale perf on one laptop; other environments take TA's counts.
  seed_volume_users: "20"
  seed_volume_zaken: "2000"
  seed_volume_partijen: "500"
  seed_volume_objecten: "300"
  seed_volume_internetaken: "50"
  seed_volume_vac: "200"
  seed_volume_kennisartikelen: "200"
  # seed-volume may add the volume zaaktype to PABC's entity types, so ZAC shows its zaken to the test admin.
  pabc_volume_zaaktype: true
  # One pod per component by default; tests using fixture several_replicas switch redis-ha to 3 and Keycloak to 2
  # (tier chaos).
  replicas_command: /home/kvv/development/werk/infonl-dimpact/infonl/podiumd-minikube/bin/replicas
  # Shared with the podiumd-minikube agent; bootstrap and writing runs take it.
  lock_file: /home/kvv/development/werk/infonl-dimpact/infonl/.minikube-lock
