# ICATT podiumd-infra AKS environment james00 (values/james00/).
# values/james00/infra.yaml pins no chartVersion.
estate: podiumd-infra
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-james00-aks
  namespace: podiumd
  monitoring_namespace: monitoring
keyvault: podiumd-james00-kv
urls:
  zac: https://zac.james00.pd.test-rig.nl
  openzaak: https://openzaak.james00.pd.test-rig.nl
  keycloak: https://keycloak.james00.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.james00.pd.test-rig.nl
  openformulieren: https://formulier.james00.pd.test-rig.nl
  openklant: https://openklant.james00.pd.test-rig.nl
  objecten: https://objecten.james00.pd.test-rig.nl
  objecttypen: https://objecttypen.james00.pd.test-rig.nl
  opennotificaties: https://notificaties.james00.pd.test-rig.nl
secrets:
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  keycloak_test_user_password:
    keyvault: {secret: keycloak-user-james00-password}
