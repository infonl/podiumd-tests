# ICATT podiumd-infra AKS environment bas00 (values/bas00/).
estate: podiumd-infra
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-bas00-aks
  namespace: podiumd
  monitoring_namespace: monitoring
urls:
  zac: https://zac.bas00.pd.test-rig.nl
  openzaak: https://openzaak.bas00.pd.test-rig.nl
  keycloak: https://keycloak.bas00.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.bas00.pd.test-rig.nl
  pabc: https://pabc.bas00.pd.test-rig.nl
  openformulieren: https://formulier.bas00.pd.test-rig.nl
  openklant: https://openklant.bas00.pd.test-rig.nl
  objecten: https://objecten.bas00.pd.test-rig.nl
  objecttypen: https://objecttypen.bas00.pd.test-rig.nl
  opennotificaties: https://notificaties.bas00.pd.test-rig.nl
secrets:
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  kiss_elastic_password:
    k8s_secret: {name: kiss-es-elastic-user, key: elastic}
