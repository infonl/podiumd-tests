# ICATT podiumd-infra AKS environment felix00 (values/felix00/).
# values/felix00/infra.yaml pins no chartVersion.
estate: podiumd-infra
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-felix00-aks
  namespace: podiumd
  monitoring_namespace: monitoring
keyvault: podiumd-felix00-kv
urls:
  zac: https://zac.felix00.pd.test-rig.nl
  openzaak: https://openzaak.felix00.pd.test-rig.nl
  keycloak: https://keycloak.felix00.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.felix00.pd.test-rig.nl
  kiss: https://contact.felix00.pd.test-rig.nl
  pabc: https://pabc.felix00.pd.test-rig.nl
  openarchiefbeheer: https://abc.felix00.pd.test-rig.nl
  openinwoner: https://portaal.felix00.pd.test-rig.nl
  openformulieren: https://formulier.felix00.pd.test-rig.nl
  openklant: https://openklant.felix00.pd.test-rig.nl
  objecten: https://objecten.felix00.pd.test-rig.nl
  objecttypen: https://objecttypen.felix00.pd.test-rig.nl
  opennotificaties: https://notificaties.felix00.pd.test-rig.nl
secrets:
  # Legacy Bitnami Keycloak (keycloak.enabled); its admin username is in no Secret.
  keycloak_admin_password:
    k8s_secret: {name: keycloak, key: admin-password}
  keycloak_test_user_password:
    keyvault: {secret: keycloak-user-felix00-password}
