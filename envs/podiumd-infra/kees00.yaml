# ICATT podiumd-infra AKS environment kees00 (values/kees00/).
estate: podiumd-infra
chart_version: "4.9.4"
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-kees00-aks
  namespace: podiumd
  monitoring_namespace: monitoring
keyvault: podiumd-kees00-kv
urls:
  zac: https://zac.kees00.pd.test-rig.nl
  openzaak: https://openzaak.kees00.pd.test-rig.nl
  keycloak: https://keycloak.kees00.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.kees00.pd.test-rig.nl
  kiss: https://contact.kees00.pd.test-rig.nl
  ita: https://ita.kees00.pd.test-rig.nl
  pabc: https://pabc.kees00.pd.test-rig.nl
  openinwoner: https://portaal.kees00.pd.test-rig.nl
  openformulieren: https://formulier.kees00.pd.test-rig.nl
  openklant: https://openklant.kees00.pd.test-rig.nl
  objecten: https://objecten.kees00.pd.test-rig.nl
  objecttypen: https://objecttypen.kees00.pd.test-rig.nl
  opennotificaties: https://notificaties.kees00.pd.test-rig.nl
  omc: https://omc.kees00.pd.test-rig.nl
  grafana: https://grafana.kees00.pd.test-rig.nl
  mailpit: https://mailpit.kees00.pd.test-rig.nl
  openbeheer: https://openbeheer.kees00.pd.test-rig.nl
  referentielijsten: https://referentielijsten.kees00.pd.test-rig.nl
  openarchiefbeheer: https://abc.kees00.pd.test-rig.nl
secrets:
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  keycloak_test_user_password:
    keyvault: {secret: keycloak-user-kees00-password}
  # Grafana's own admin (basic auth), from the monitoring stack podiumd-infra deploys with
  # grafana-deploy=true. grafana-admin in Key Vault is a Keycloak SSO user and cannot log in with basic auth.
  grafana_username:
    k8s_secret: {name: monitoring-grafana, key: admin-user, namespace: monitoring}
  grafana_password:
    k8s_secret: {name: monitoring-grafana, key: admin-password, namespace: monitoring}
  # Signs the bootstrap's OMC abonnement token; read from OMC's own Secret.
  omc_jwt_secret:
    k8s_secret: {name: omc, key: OMC_AUTH_JWT_SECRET}
  # The ZGW smoke tests sign as Open Formulieren's Open Zaak client (settings.zgw_client_id).
  zgw_client_secret:
    zgw_jwt_secret: {deployment: openzaak, client_id: formulier}
settings:
  # The owner allows bootstrap to change these (2026-10-10). The ZAC ones act on productaanvraag_zaaktype,
  # which needs kees00's ZAC zaakafhandelparameters (runtime data, not in its values).
  zac_email_confirmation: true
  zac_besluittype: true
  kiss_kanalen: true
  # Open Formulieren's Open Zaak client in podiumd-infra's values is "formulier", not the default "open-formulieren".
  openformulieren_zgw_client_id: formulier
  zgw_client_id: formulier
