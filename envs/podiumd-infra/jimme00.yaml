# ICATT podiumd-infra AKS environment jimme00 (values/jimme00/).
# values/jimme00/infra.yaml pins no chartVersion.
estate: podiumd-infra
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-jimme00-aks
  namespace: podiumd
  monitoring_namespace: monitoring
keyvault: podiumd-jimme00-kv
urls:
  zac: https://zac.jimme00.pd.test-rig.nl
  openzaak: https://openzaak.jimme00.pd.test-rig.nl
  keycloak: https://keycloak.jimme00.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.jimme00.pd.test-rig.nl
  kiss: https://contact.jimme00.pd.test-rig.nl
  # infra.yaml routes ITA only on internetaakafhandeling; ITA's own host ita.jimme00 has no ingress.
  ita: https://internetaakafhandeling.jimme00.pd.test-rig.nl
  pabc: https://pabc.jimme00.pd.test-rig.nl
  openarchiefbeheer: https://abc.jimme00.pd.test-rig.nl
  openinwoner: https://portaal.jimme00.pd.test-rig.nl
  openformulieren: https://formulier.jimme00.pd.test-rig.nl
  openklant: https://openklant.jimme00.pd.test-rig.nl
  objecten: https://objecten.jimme00.pd.test-rig.nl
  objecttypen: https://objecttypen.jimme00.pd.test-rig.nl
  opennotificaties: https://notificaties.jimme00.pd.test-rig.nl
  omc: https://omc.jimme00.pd.test-rig.nl
secrets:
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  keycloak_test_user_password:
    keyvault: {secret: keycloak-user-jimme00-password}
