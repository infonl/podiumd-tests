# ICATT podiumd-infra AKS environment jim02 (values/jim02/).
# values/jim02/infra.yaml pins no chartVersion.
estate: podiumd-infra
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-jim02-aks
  namespace: podiumd
  monitoring_namespace: monitoring
keyvault: podiumd-jim02-kv
urls:
  openzaak: https://openzaak.jim02.pd.test-rig.nl
  keycloak: https://keycloak.jim02.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.jim02.pd.test-rig.nl
  kiss: https://contact.jim02.pd.test-rig.nl
  # infra.yaml routes ITA only on internetaakafhandeling; ITA's own host ita.jim02 has no ingress.
  ita: https://internetaakafhandeling.jim02.pd.test-rig.nl
  pabc: https://pabc.jim02.pd.test-rig.nl
  openinwoner: https://portaal.jim02.pd.test-rig.nl
  openformulieren: https://formulier.jim02.pd.test-rig.nl
  openklant: https://openklant.jim02.pd.test-rig.nl
  objecten: https://objecten.jim02.pd.test-rig.nl
  objecttypen: https://objecttypen.jim02.pd.test-rig.nl
  opennotificaties: https://notificaties.jim02.pd.test-rig.nl
  omc: https://omc.jim02.pd.test-rig.nl
secrets:
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
  keycloak_test_user_password:
    keyvault: {secret: keycloak-user-jim02-password}
