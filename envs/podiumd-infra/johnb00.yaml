# ICATT podiumd-infra AKS environment johnb00 (values/johnb00/).
estate: podiumd-infra
allowed_tiers: [smoke, core, full, perf]
kube:
  context: podiumd-johnb00-aks
  namespace: podiumd
  monitoring_namespace: monitoring
urls:
  zac: https://zac.johnb00.pd.test-rig.nl
  openzaak: https://openzaak.johnb00.pd.test-rig.nl
  keycloak: https://keycloak.johnb00.pd.test-rig.nl
  keycloak-admin: https://keycloak-admin.johnb00.pd.test-rig.nl
  pabc: https://pabc.johnb00.pd.test-rig.nl
  kiss: https://contact.johnb00.pd.test-rig.nl
  ita: https://internetaakafhandeling.johnb00.pd.test-rig.nl
  openinwoner: https://portaal.johnb00.pd.test-rig.nl
  openbeheer: https://openbeheer.johnb00.pd.test-rig.nl
  openformulieren: https://formulier.johnb00.pd.test-rig.nl
  openklant: https://openklant.johnb00.pd.test-rig.nl
  objecten: https://objecten.johnb00.pd.test-rig.nl
  objecttypen: https://objecttypen.johnb00.pd.test-rig.nl
  opennotificaties: https://notificaties.johnb00.pd.test-rig.nl
  mailpit: https://mailpit.johnb00.pd.test-rig.nl
  # No ingress: reached through a port-forward. Open Inwoner reaches KvK through the outway
  # (chart openinwoner.kvk, helm-charts #604); the tests compare against the api-proxy.
  api-proxy: http://api-proxy.podiumd.svc.cluster.local
  frankgateway: http://frankgateway-outway.podiumd.svc.cluster.local:9080
settings:
  # podiumd's e2e zaaktype. ZAC's zaakafhandelparameters for it are runtime data, seeded on
  # 2026-10-13 with productaanvraagtype productaanvraag-e2e-test (podiumd-infra seed script).
  productaanvraag_type: productaanvraag-e2e-test
  productaanvraag_zaaktype: zaaktype-voor-e2e-testen
  # The owner allows bootstrap to change these (2026-10-14). The ZAC ones act on productaanvraag_zaaktype.
  zac_email_confirmation: true
  zac_besluittype: true
  zgw_client_id: formulier
secrets:
  keycloak_admin_username:
    k8s_secret: {name: keycloak-podiumd-admin, key: username}
  keycloak_admin_password:
    k8s_secret: {name: keycloak-podiumd-admin, key: password}
